<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Globeprint</title>
<link rel="icon" href="favicon.png">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0B1224; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #b8c0d4; font-size: 15px; line-height: 1.4; }
  a.btn { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 999px; background: #2F7BF6; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1 id="t">Volviendo a Globeprint…</h1>
  <p id="m">Si la app no se abre sola, toca el botón.</p>
  <a class="btn" id="b" href="#">Abrir Globeprint</a>
</main>
<script>
  // Puente de regreso después de entrar con Google, Facebook, Apple o el enlace del correo:
  // reenvía el código a la app. Solo abre la app de Globeprint (nunca otras páginas).
  (function () {
    var en = !/^es/i.test(navigator.language || '');
    if (en) {
      document.getElementById('t').textContent = 'Returning to Globeprint…';
      document.getElementById('m').textContent = "If the app doesn't open, tap the button.";
      document.getElementById('b').textContent = 'Open Globeprint';
    }
    var q = new URLSearchParams(location.search);
    var to = q.get('to') || 'globeprint://auth-callback';
    if (!/^(exp|exps|globeprint):\/\//i.test(to)) to = 'globeprint://auth-callback';
    q.delete('to');
    var extra = q.toString();
    var target = to + (extra ? (to.indexOf('?') >= 0 ? '&' : '?') + extra : '') + (location.hash || '');
    document.getElementById('b').href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
